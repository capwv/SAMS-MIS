function decodeSite(id){ const b = atob(SITES[id]); const u = Uint8Array.from(b, c => c.charCodeAt(0)); return new TextDecoder('utf-8').decode(u); }
const KEY = 'sams-mis:last';
const $ = id => document.getElementById(id);
const get = () => { try { return localStorage.getItem(KEY); } catch(e) { return null; } };
const set = v => { try { localStorage.setItem(KEY, v); } catch(e) {} };
const byId = id => SUBJECTS.find(s => s.id === id);

function renderGrid(list) {
  $('grid').innerHTML = list.map(s => `
    <button class="subj-card glass rounded-2xl p-5 flex flex-col gap-3 w-full" style="--c:${s.color}" onclick="openSubject('${s.id}')">
      <div class="flex items-center gap-3">
        <div class="subj-icon w-14 h-14 rounded-2xl flex items-center justify-center text-2xl shrink-0"><i class="fa-solid ${s.icon}"></i></div>
        <div class="min-w-0">
          <h2 class="text-lg font-extrabold text-white leading-snug">${s.title}</h2>
          <div class="text-xs font-semibold" style="color:${s.color}" dir="ltr">${s.en}</div>
        </div>
      </div>
      <p class="text-sm text-slate-300 leading-relaxed">${s.desc}</p>
      <div class="flex flex-wrap gap-1.5 mt-auto">${s.tags.map(t => `<span class="chip text-[11px] font-bold px-2.5 py-0.5 rounded-lg">${t}</span>`).join('')}</div>
      <div class="flex items-center gap-1.5 text-xs font-bold" style="color:${s.color}"><span>فتح المادة</span><i class="fa-solid fa-arrow-left"></i></div>
    </button>`).join('');
  $('empty').classList.toggle('hidden', list.length > 0);
}

function renderContinue() {
  const s = byId(get());
  const box = $('continueBox');
  if (!s) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  box.innerHTML = `
    <button onclick="openSubject('${s.id}')" class="glass w-full rounded-2xl p-4 flex items-center justify-between gap-3 hover:border-amber-500 transition" style="border-right:4px solid ${s.color}">
      <div class="flex items-center gap-3 text-right">
        <div class="subj-icon w-11 h-11 rounded-xl flex items-center justify-center text-lg shrink-0" style="--c:${s.color}"><i class="fa-solid ${s.icon}"></i></div>
        <div><div class="text-xs text-slate-400">كمّل من حيث وقفت</div><div class="font-extrabold text-white">آخر مادة فتحتها: ${s.title}</div></div>
      </div>
      <span class="bg-amber-500 text-slate-950 font-extrabold text-xs px-4 py-2 rounded-xl shrink-0"><i class="fa-solid fa-play ml-1"></i> متابعة</span>
    </button>`;
}

function openSubject(id, fromHash) {
  const s = byId(id); if (!s) return;
  set(id);
  const f = $('frame');
  if (f.dataset.id !== id) { f.srcdoc = decodeSite(id); f.dataset.id = id; }
  $('viewerTitle').textContent = s.title;
  $('viewer').classList.add('open');
  document.body.style.overflow = 'hidden';
  if (!fromHash && location.hash !== '#' + id) location.hash = id;
}

function closeSubject(fromHash) {
  $('viewer').classList.remove('open');
  document.body.style.overflow = '';
  renderContinue();
  if (!fromHash && location.hash) history.pushState('', document.title, location.pathname + location.search);
}

function route() {
  const id = location.hash.replace('#', '');
  if (byId(id)) openSubject(id, true); else closeSubject(true);
}

$('backBtn').onclick = () => closeSubject(false);
$('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  renderGrid(SUBJECTS.filter(s => !q || (s.title + ' ' + s.en + ' ' + s.desc + ' ' + s.tags.join(' ')).toLowerCase().includes(q)));
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('viewer').classList.contains('open')) closeSubject(false); });
window.addEventListener('hashchange', route);

renderGrid(SUBJECTS);
renderContinue();
route();
</script>
</body>
